<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano settimanale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --ink:#14141A; --ink-soft:#6B6B76; --ink-faint:#A8A8B3;
    --line:#ECECF2; --line-strong:#DDDDE6; --shadow:0 6px 18px rgba(20,20,26,.08);
    --accent:#6C5CE7; --radius:20px; --radius-sm:12px;
  }
  html[data-theme="dark"]{
    --bg:#0A0A0D; --panel:#17171D; --ink:#F3F3F7; --ink-soft:#9E9EAC; --ink-faint:#6A6A78;
    --line:#232329; --line-strong:#2E2E36; --shadow:0 6px 20px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  body{ margin:0; padding:20px 24px 40px; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; transition:background .2s,color .2s; }
  h1,h2,.day-name{ font-family:'Baloo 2',sans-serif; }

  .head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  h1{font-size:26px; font-weight:800; margin:0; letter-spacing:-.3px;}
  p.sub{font-size:13px; color:var(--ink-soft); margin:4px 0 0;}
  #syncstat{font-size:11px; color:var(--ink-faint); white-space:nowrap;}
  #syncstat.busy{color:#3B82F6;} #syncstat.err{color:#EF4444;} #syncstat.ok{color:#10B981;}

  .toolbar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .btn{ font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px;
    border:1.5px solid var(--line-strong); background:var(--panel); color:var(--ink); cursor:pointer; transition:all .15s; }
  .btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.08); color:#fff; }
  .iconbtn{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--panel);
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .iconbtn:hover{border-color:var(--accent); color:var(--accent);}

  .legend{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .legend .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 12px 5px 8px;
    border-radius:999px; cursor:pointer; border:1.5px solid transparent; }
  .legend .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}

  .board{ display:grid; grid-template-columns:52px repeat(7,minmax(128px,1fr)); gap:8px; overflow-x:auto; }
  .axis-head{}
  .day-head{ text-align:center; padding-bottom:6px; }
  .day-name{ font-size:15px; font-weight:700; }
  .day-tot{ font-size:11px; color:var(--ink-faint); font-weight:500; }

  .axis{ position:relative; }
  .axis .hr{ position:absolute; left:0; right:4px; font-size:10px; color:var(--ink-faint); text-align:right;
    transform:translateY(-6px); font-variant-numeric:tabular-nums; }

  .daycol{ position:relative; background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); overflow:hidden;
    background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--pph)); }
  .daycol.dragover{ border-color:var(--accent); }

  .block{ position:absolute; left:4px; right:4px; border-radius:14px; padding:6px 9px 5px; cursor:grab;
    box-shadow:var(--shadow); overflow:hidden; touch-action:none; user-select:none; transition:box-shadow .15s, opacity .15s; }
  .block:active{cursor:grabbing;}
  .block.selected{ outline:2.5px solid var(--ink); outline-offset:2px; }
  .block.dragging{ opacity:.55; z-index:50; box-shadow:0 12px 28px rgba(0,0,0,.25); }
  .block-cont{ border-top:2px dashed rgba(255,255,255,.5); }
  .block .lbl{ font-size:12px; font-weight:700; line-height:1.25; }
  .block .tm{ font-size:10px; font-weight:600; opacity:.8; font-variant-numeric:tabular-nums; }
  .block .resize{ position:absolute; left:0; right:0; bottom:0; height:9px; cursor:ns-resize; }
  .block .resize::after{ content:''; position:absolute; left:50%; bottom:3px; width:22px; height:3px; border-radius:3px;
    background:currentColor; opacity:.35; transform:translateX(-50%); }

  .addbtn{ margin-top:8px; font-size:11px; font-weight:600; padding:6px;
    border:1.5px dashed var(--line-strong); border-radius:10px; background:transparent; color:var(--ink-faint); cursor:pointer; }
  .addbtn:hover{border-color:var(--accent); color:var(--accent);}
  .sonno{ position:absolute; bottom:-70px; left:4px; right:4px; border-radius:10px; padding:7px 9px; font-size:11px;
    background:var(--bg); border:1.5px solid var(--line); color:var(--ink-faint); font-weight:600; }

  /* inspector panel */
  .backdrop{ position:fixed; inset:0; background:rgba(10,10,13,.35); display:none; z-index:100; }
  .backdrop.open{display:block;}
  .inspector{ position:fixed; top:0; right:0; height:100%; width:320px; max-width:88vw; background:var(--panel);
    border-left:1.5px solid var(--line); box-shadow:-10px 0 30px rgba(0,0,0,.15); z-index:101;
    transform:translateX(100%); transition:transform .22s ease; padding:22px 20px; overflow-y:auto; }
  .inspector.open{ transform:translateX(0); }
  .inspector h3{ margin:0 0 16px; font-size:18px; font-weight:700; font-family:'Baloo 2',sans-serif; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px; }
  .field input[type=text]{ width:100%; font-size:14px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--line-strong);
    background:var(--bg); color:var(--ink); font-family:inherit; }
  .field input[type=time]{ font-size:14px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line-strong);
    background:var(--bg); color:var(--ink); font-family:inherit; }
  html[data-theme="dark"] .field input[type=time]{ color-scheme:dark; }
  .catgrid{ display:flex; flex-wrap:wrap; gap:8px; }
  .catopt{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:6px 10px; border-radius:999px;
    border:1.5px solid var(--line-strong); cursor:pointer; background:var(--bg); color:var(--ink); }
  .catopt.active{ border-color:var(--ink); }
  .catopt .dot{width:9px;height:9px;border-radius:50%;}
  .durrow{ display:flex; align-items:center; gap:10px; }
  .durrow button{ width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--bg);
    color:var(--ink); font-size:16px; cursor:pointer; }
  .durrow button:hover{border-color:var(--accent); color:var(--accent);}
  .durval{ font-size:14px; font-weight:700; min-width:70px; text-align:center; }
  .inspector .row{ display:flex; gap:8px; margin-top:22px; }
  .del-btn{ background:none; border:1.5px solid #EF4444; color:#EF4444; }
  .del-btn:hover{ background:#EF4444; color:#fff; }
  .close-x{ position:absolute; top:18px; right:18px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-faint); }

  /* category modal */
  .modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--panel); border-radius:var(--radius);
    box-shadow:0 20px 50px rgba(0,0,0,.25); z-index:102; width:380px; max-width:90vw; max-height:80vh; overflow-y:auto;
    padding:22px; display:none; }
  .modal.open{display:block;}
  .modal h3{ margin:0 0 14px; font-size:18px; font-family:'Baloo 2',sans-serif; }
  .catrow{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .catrow input[type=color]{ width:32px; height:32px; border:none; border-radius:8px; padding:0; background:none; cursor:pointer; flex-shrink:0; }
  .catrow input[type=text]{ flex:1; font-size:13px; padding:7px 10px; border-radius:8px; border:1.5px solid var(--line-strong);
    background:var(--bg); color:var(--ink); font-family:inherit; min-width:0; }
  .catrow .rm{ background:none; border:none; color:var(--ink-faint); font-size:16px; cursor:pointer; flex-shrink:0; }
  .catrow .rm:hover{ color:#EF4444; }
  .addcat{ display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1.5px solid var(--line); }

  @media (max-width:900px){ .board{grid-template-columns:40px repeat(7,140px);} }
</style>
</head>
<body>

<div class="head">
  <div>
    <h1>Piano settimanale</h1>
    <p class="sub">Trascina un blocco per spostarlo, tira il bordo inferiore per allungarlo. Clicca un blocco per modificarlo.</p>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <div id="syncstat">—</div>
    <button class="iconbtn" id="themeBtn" title="Cambia tema">🌙</button>
  </div>
</div>

<div class="toolbar">
  <button class="btn primary" id="addCatBtn">+ categoria</button>
  <button class="btn" onclick="resetSeed()">Ripristina piano base</button>
  <button class="btn" onclick="exportJSON()">Esporta JSON</button>
  <button class="btn" onclick="document.getElementById('importFile').click()">Importa JSON</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
</div>

<div class="legend" id="legend"></div>
<div class="board" id="board"></div>

<div class="backdrop" id="backdrop"></div>

<div class="inspector" id="inspector">
  <button class="close-x" id="closeInsp">✕</button>
  <h3>Modifica blocco</h3>
  <div class="field">
    <label>Nome</label>
    <input type="text" id="fLabel">
  </div>
  <div class="field">
    <label>Categoria</label>
    <div class="catgrid" id="fCatgrid"></div>
  </div>
  <div class="field">
    <label>Orario</label>
    <div class="durrow">
      <input type="time" id="fStart" step="900">
      <span class="durval" id="fEnd" style="text-align:left;"></span>
    </div>
  </div>
  <div class="field">
    <label>Durata</label>
    <div class="durrow">
      <button id="fDurMinus">−</button>
      <span class="durval" id="fDur"></span>
      <button id="fDurPlus">+</button>
    </div>
  </div>
  <div class="row" id="fDupRow" style="margin-top:10px;">
    <button class="btn" id="fDup" style="flex:1;">Duplica</button>
    <button class="btn" id="fCopyAll" style="flex:1;">Copia su tutti i giorni</button>
  </div>
  <div class="row">
    <button class="btn del-btn" id="fDel" style="flex:1;">Elimina</button>
  </div>
</div>

<div class="modal" id="catModal">
  <h3>Categorie e colori</h3>
  <div id="catList"></div>
  <div class="addcat">
    <input type="color" id="newCatColor" value="#6C5CE7">
    <input type="text" id="newCatLabel" placeholder="Nome nuova categoria">
    <button class="btn primary" id="addCatConfirm">Aggiungi</button>
  </div>
  <div class="row"><button class="btn" id="closeCatModal" style="flex:1;">Chiudi</button></div>
</div>

<script>
/* ====== CONFIG SUPABASE ======
   Stesso progetto del training tracker: https://rmnvlhqfqjqcpqawodsb.supabase.co
   Incolla qui la tua anon key (Supabase dashboard > Settings > API > Project API keys > anon public)
*/
const SUPABASE_URL = 'https://rmnvlhqfqjqcpqawodsb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtbnZsaHFmcWpxY3BxYXdvZHNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTI1NDMsImV4cCI6MjA5ODIyODU0M30.ANBwMezQEnb7tYVMtN6os1yZv8wnNjEQLtKI48BreeM';
const PLAN_ROW_ID = 'federico';

let sb = null;
try{
  if(SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'INCOLLA_QUI_LA_TUA_ANON_KEY'){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.warn('Supabase non inizializzato', e); }

const DAY_NAMES = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const STORAGE_KEY = 'federico-planner-v2';
const THEME_KEY = 'federico-planner-theme';
const GRID_START = 0, GRID_END = 24; // giornata intera, blocchi oltre mezzanotte vengono croppati in fondo
const PPH = 42; // px per ora
const SLEEP_DUR = 7; // durata di default del blocco sonno (modificabile come gli altri)

function defaultCategories(){
  return {
    neutro:   {label:'Pausa / buffer',        color:'#8E8E9A'},
    routine:  {label:'Routine mattutina',     color:'#10B981'},
    studio:   {label:'Studio',                color:'#6C5CE7'},
    ricerca:  {label:'Ricerca / volontariato',color:'#F97316'},
    sport:    {label:'Sport',                 color:'#84CC16'},
    relazioni:{label:'Relazioni',             color:'#EC4899'},
    gaming:   {label:'Gaming / YouTube',      color:'#3B82F6'},
    sonno:    {label:'Sonno',                 color:'#4A4A57'}
  };
}

function seedDays(){
  const mk = (label,cat,start,dur,extra) => ({id:crypto.randomUUID(), label, cat, start, dur, ...extra});
  return DAY_NAMES.map(() => ([
    mk('Routine mattutina','routine',8.5,0.75),
    mk('Studio','studio',9.5,3),
    mk('Studio','studio',15,3),
    mk('Sonno','sonno',0.5,SLEEP_DUR)
  ]));
}

let CATS = defaultCategories();
let DAYS = seedDays();
let saveTimer = null;
let selectedId = null;
let drag = null;

/* ---------- theme ---------- */
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

/* ---------- persistence ---------- */
function setSync(state){
  const el = document.getElementById('syncstat');
  el.className = state;
  el.textContent = state==='busy' ? 'sincronizzo…' : state==='err' ? 'errore sync (salvato in locale)' : state==='ok' ? 'sincronizzato' : 'solo locale';
}
async function init(){
  initTheme();
  const local = loadLocal();
  if(local){ DAYS = local.days || DAYS; CATS = local.cats || CATS; }
  if(sb){
    setSync('busy');
    try{
      const { data, error } = await sb.from('planner_state').select('data').eq('id', PLAN_ROW_ID).maybeSingle();
      if(error) throw error;
      if(data && data.data){ DAYS = data.data.days || DAYS; CATS = data.data.cats || CATS; saveLocal(); }
      setSync('ok');
    }catch(e){ console.warn(e); setSync('err'); }
  } else setSync('local');
  renderLegend();
  render();
}
function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ return null; }
}
function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({days:DAYS, cats:CATS})); }
function save(){
  saveLocal();
  if(!sb) return;
  clearTimeout(saveTimer);
  setSync('busy');
  saveTimer = setTimeout(async () => {
    try{
      const { error } = await sb.from('planner_state').upsert({ id: PLAN_ROW_ID, data:{days:DAYS,cats:CATS}, updated_at: new Date().toISOString() });
      if(error) throw error;
      setSync('ok');
    }catch(e){ console.warn(e); setSync('err'); }
  }, 700);
}
function resetSeed(){
  if(confirm('Ripristinare il piano base? Le modifiche attuali andranno perse.')){
    DAYS = seedDays(); CATS = defaultCategories(); save(); renderLegend(); render();
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({days:DAYS,cats:CATS},null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'piano-settimanale.json'; a.click();
}
function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{ const d = JSON.parse(ev.target.result); DAYS = d.days||DAYS; CATS = d.cats||CATS; save(); renderLegend(); render(); }
    catch(err){ alert('File non valido'); }
  };
  reader.readAsText(file);
}

/* ---------- helpers ---------- */
function fmt(h){
  h = ((h % 24) + 24) % 24;
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function snap(h){ return Math.round(h*4)/4; }
function clampStart(start){ return ((start%24)+24)%24; }
function blockSegments(b){
  const end = b.start + b.dur;
  if(end <= GRID_END) return [{start:b.start, dur:b.dur, primary:true, wrapped:false}];
  return [
    {start:b.start, dur:GRID_END-b.start, primary:true, wrapped:true},
    {start:GRID_START, dur:end-GRID_END, primary:false, wrapped:true}
  ];
}
function textColor(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b) > 150 ? '#14141A' : '#FFFFFF';
}

/* ---------- legend ---------- */
function renderLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = '';
  Object.entries(CATS).forEach(([k,c]) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.background = c.color + '22';
    chip.style.color = c.color;
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = openCatModal;
    el.appendChild(chip);
  });
  const gear = document.createElement('span');
  gear.className = 'chip';
  gear.style.color = 'var(--ink-faint)';
  gear.textContent = '⚙ gestisci';
  gear.onclick = openCatModal;
  el.appendChild(gear);
}

/* ---------- board render ---------- */
function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.setProperty('--pph', PPH+'px');
  const totalH = (GRID_END-GRID_START)*PPH;

  // axis column
  const axisHead = document.createElement('div');
  board.appendChild(axisHead);
  DAY_NAMES.forEach((name,i)=>{
    const h = document.createElement('div');
    h.className = 'day-head';
    const tot = Math.round(DAYS[i].filter(b=>b.cat!=='sonno').reduce((s,b)=>s+Number(b.dur||0),0)*4)/4;
    h.innerHTML = `<div class="day-name">${name}</div><div class="day-tot">${tot}h attive</div>`;
    board.appendChild(h);
  });

  const axis = document.createElement('div');
  axis.className = 'axis';
  axis.style.height = totalH+'px';
  for(let h=Math.ceil(GRID_START); h<Math.floor(GRID_END); h++){
    const lab = document.createElement('div');
    lab.className = 'hr';
    lab.style.top = ((h-GRID_START)*PPH)+'px';
    lab.textContent = fmt(h);
    axis.appendChild(lab);
  }
  board.appendChild(axis);

  DAYS.forEach((blocks, dayIdx) => {
    const col = document.createElement('div');
    col.className = 'daycol';
    col.style.height = totalH+'px';
    col.dataset.day = dayIdx;

    blocks.forEach(b => {
      blockSegments(b).forEach(seg => col.appendChild(renderBlock(b, seg, dayIdx)));
    });

    col.addEventListener('dragover', e => e.preventDefault());
    board.appendChild(col);
  });

  board.appendChild(document.createElement('div')); // cella vuota sotto l'asse
  DAYS.forEach((blocks, dayIdx) => {
    const addBtn = document.createElement('button');
    addBtn.className = 'addbtn';
    addBtn.textContent = '+ blocco';
    addBtn.onclick = () => {
      const last = blocks[blocks.length-1];
      const start = clampStart(last ? last.start+last.dur : GRID_START);
      const cat = Object.keys(CATS)[0];
      const nb = {id:crypto.randomUUID(), label:CATS[cat].label, cat, start, dur:0.5};
      DAYS[dayIdx].push(nb); save(); render();
      openInspector(nb.id, dayIdx);
    };
    board.appendChild(addBtn);
  });
}

function renderBlock(b, seg, dayIdx){
  const c = CATS[b.cat] || Object.values(CATS)[0];
  const el = document.createElement('div');
  const interactive = seg.primary;
  el.className = 'block' + (b.id===selectedId ? ' selected' : '') + (interactive ? '' : ' block-cont');
  el.style.top = ((seg.start-GRID_START)*PPH)+'px';
  el.style.height = Math.max(18, seg.dur*PPH-3)+'px';
  el.style.background = c.color;
  el.style.color = textColor(c.color);
  el.dataset.id = b.id;
  if(!interactive){
    el.innerHTML = `<div class="tm">fino alle ${fmt(b.start+b.dur)}</div>`;
    el.style.opacity = '.75';
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => openInspector(b.id, dayIdx));
    return el;
  }
  const allowResize = !seg.wrapped;
  const resizeHtml = allowResize ? '<div class="resize"></div>' : '';
  el.innerHTML = `<div class="tm">${fmt(b.start)}–${fmt(b.start+b.dur)}</div><div class="lbl">${b.label}</div>${resizeHtml}`;
  attachBlockEvents(el, b, dayIdx, allowResize);
  return el;
}

/* ---------- drag / resize ---------- */
function attachBlockEvents(el, b, dayIdx, allowResize){
  const resizeHandle = allowResize ? el.querySelector('.resize') : null;

  if(resizeHandle) resizeHandle.addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault();
    resizeHandle.setPointerCapture(e.pointerId);
    const startY = e.clientY, origDur = b.dur;
    el.classList.add('dragging');
    function move(ev){
      const dy = ev.clientY - startY;
      let nd = snap(origDur + dy/PPH);
      nd = Math.max(0.25, Math.min(nd, GRID_END-b.start));
      b.dur = nd;
      el.style.height = Math.max(18, nd*PPH-3)+'px';
      el.querySelector('.tm').textContent = `${fmt(b.start)}–${fmt(b.start+b.dur)}`;
    }
    function up(ev){
      resizeHandle.removeEventListener('pointermove', move);
      resizeHandle.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      save(); render();
    }
    resizeHandle.addEventListener('pointermove', move);
    resizeHandle.addEventListener('pointerup', up);
  });

  el.addEventListener('pointerdown', e => {
    if(e.target === resizeHandle) return;
    el.setPointerCapture(e.pointerId);
    const startX = e.clientX, startY = e.clientY;
    const origStart = b.start;
    let moved = false;
    function move(ev){
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      if(Math.abs(dx)>5 || Math.abs(dy)>5) moved = true;
      if(!moved) return;
      el.classList.add('dragging');
      b.start = clampStart(snap(origStart + dy/PPH));
      el.style.top = ((Math.min(b.start,GRID_END)-GRID_START)*PPH)+'px';
      const segs = blockSegments(b);
      el.style.height = Math.max(18, segs[0].dur*PPH-3)+'px';
      el.querySelector('.tm').textContent = `${fmt(b.start)}–${fmt(b.start+b.dur)}`;
      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetCol = target && target.closest('.daycol');
      document.querySelectorAll('.daycol').forEach(c=>c.classList.remove('dragover'));
      if(targetCol) targetCol.classList.add('dragover');
    }
    function up(ev){
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      document.querySelectorAll('.daycol').forEach(c=>c.classList.remove('dragover'));
      el.classList.remove('dragging');
      if(!moved){ openInspector(b.id, dayIdx); return; }
      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetCol = target && target.closest('.daycol');
      const newDay = targetCol ? Number(targetCol.dataset.day) : dayIdx;
      if(newDay !== dayIdx){
        DAYS[dayIdx] = DAYS[dayIdx].filter(x=>x.id!==b.id);
        DAYS[newDay].push(b);
      }
      save(); render();
    }
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}

/* ---------- inspector ---------- */
function findBlock(id){
  for(let d=0; d<DAYS.length; d++){
    const b = DAYS[d].find(x=>x.id===id);
    if(b) return {b, day:d};
  }
  return null;
}
function openInspector(id, dayIdx){
  selectedId = id;
  const found = findBlock(id); if(!found) return;
  const b = found.b;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('inspector').classList.add('open');
  document.getElementById('fLabel').value = b.label;
  document.getElementById('fStart').value = fmt(b.start);
  document.getElementById('fEnd').textContent = '– ' + fmt(b.start+b.dur);
  document.getElementById('fDur').textContent = (b.dur*60)+' min';

  const grid = document.getElementById('fCatgrid');
  grid.innerHTML = '';
  Object.entries(CATS).forEach(([k,c])=>{
    const opt = document.createElement('div');
    opt.className = 'catopt' + (b.cat===k ? ' active' : '');
    opt.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    opt.onclick = () => {
      const wasAuto = !b.label.trim() || b.label === CATS[b.cat].label;
      b.cat = k;
      if(wasAuto) b.label = c.label;
      save(); render(); openInspector(id, found.day);
    };
    grid.appendChild(opt);
  });

  document.getElementById('fLabel').oninput = e => { b.label = e.target.value; };
  document.getElementById('fLabel').onchange = e => {
    if(!b.label.trim()) b.label = CATS[b.cat].label;
    e.target.value = b.label;
    save(); render();
  };
  document.getElementById('fStart').onchange = e => {
    const val = e.target.value; // "HH:MM"
    if(!val) return;
    const [hh,mm] = val.split(':').map(Number);
    b.start = clampStart(snap(hh + mm/60));
    document.getElementById('fEnd').textContent = '– ' + fmt(b.start+b.dur);
    save(); render();
  };
  document.getElementById('fDurMinus').onclick = () => { b.dur = Math.max(0.25, snap(b.dur-0.25)); save(); render(); openInspector(id, found.day); };
  document.getElementById('fDurPlus').onclick = () => { b.dur = Math.min(GRID_END-b.start, snap(b.dur+0.25)); save(); render(); openInspector(id, found.day); };
  document.getElementById('fDel').onclick = () => {
    DAYS[found.day] = DAYS[found.day].filter(x=>x.id!==id);
    closeInspector(); save(); render();
  };
  document.getElementById('fDup').onclick = () => {
    const nb = {...b, id:crypto.randomUUID(), start: clampStart(b.start+b.dur)};
    const arr = DAYS[found.day];
    arr.splice(arr.indexOf(b)+1, 0, nb);
    save(); render();
    openInspector(nb.id, found.day);
  };
  document.getElementById('fCopyAll').onclick = () => {
    DAYS.forEach((day, idx) => {
      if(idx === found.day) return;
      day.push({...b, id:crypto.randomUUID()});
    });
    save(); render();
    openInspector(id, found.day);
  };

  render(); // refresh selection highlight
}
function closeInspector(){
  selectedId = null;
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('inspector').classList.remove('open');
  render();
}
document.getElementById('closeInsp').onclick = closeInspector;
document.getElementById('backdrop').onclick = () => { closeInspector(); closeCatModal(); };

/* ---------- category modal ---------- */
function openCatModal(){
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('catModal').classList.add('open');
  renderCatList();
}
function closeCatModal(){ document.getElementById('catModal').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }
document.getElementById('closeCatModal').onclick = closeCatModal;
document.getElementById('addCatBtn').onclick = openCatModal;

function renderCatList(){
  const list = document.getElementById('catList');
  list.innerHTML = '';
  Object.entries(CATS).forEach(([k,c])=>{
    const row = document.createElement('div');
    row.className = 'catrow';
    row.innerHTML = `<input type="color" value="${c.color}"><input type="text" value="${c.label}"><button class="rm">✕</button>`;
    row.querySelector('input[type=color]').onchange = e => { c.color = e.target.value; save(); renderLegend(); render(); };
    row.querySelector('input[type=text]').onchange = e => { c.label = e.target.value; save(); renderLegend(); render(); };
    row.querySelector('.rm').onclick = () => {
      const usedElsewhere = Object.keys(CATS).length > 1;
      if(!usedElsewhere){ alert('Serve almeno una categoria.'); return; }
      DAYS.forEach(day => day.forEach(b => { if(b.cat===k) b.cat = Object.keys(CATS).find(x=>x!==k); }));
      delete CATS[k]; save(); renderLegend(); render(); renderCatList();
    };
    list.appendChild(row);
  });
}
document.getElementById('addCatConfirm').onclick = () => {
  const label = document.getElementById('newCatLabel').value.trim();
  const color = document.getElementById('newCatColor').value;
  if(!label) return;
  const id = 'cat_' + Date.now();
  CATS[id] = {label, color};
  document.getElementById('newCatLabel').value = '';
  save(); renderLegend(); render(); renderCatList();
};

init();
</script>
